name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}

    env:
      R_KEEP_PKG_SOURCE: yes

    steps:

      # ========================================================
      # 1. Checkout repository
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # 2. Set up Pandoc
      # ========================================================

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2


      # ========================================================
      # 3. Set up R
      # ========================================================

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true


      # ========================================================
      # 4. Linux system dependencies
      # ========================================================

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libxml2-dev \
            libssl-dev \
            libglu1-mesa-dev


      # ========================================================
      # 5. macOS system dependencies
      # ========================================================

      - name: Install system dependencies (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install pkg-config proj@9 gdal


      # ========================================================
      # 6. Install R package dependencies
      # ========================================================

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            rcmdcheck
            BiocManager


      # ========================================================
      # 7. Rebuild compiled statistical-model packages on macOS
      #
      # Cached/prebuilt versions of TMB, gllvm and glmmTMB may
      # have incompatible OpenMP linkage on macOS ARM64.
      #
      # Reinstall these packages from source using the current
      # R/compiler environment before checking eDNAModel.
      # ========================================================

      - name: Reinstall TMB, gllvm and glmmTMB from source on macOS
        if: runner.os == 'macOS'
        run: |
          cat("Removing cached compiled model packages...\n")

          pkgs <- rownames(installed.packages())

          for (pkg in c("glmmTMB", "gllvm", "TMB")) {
            if (pkg %in% pkgs) {
              cat("Removing", pkg, "\n")
              remove.packages(pkg)
            }
          }


          # ----------------------------------------------------
          # TMB
          # ----------------------------------------------------

          cat("\n========================================\n")
          cat("Installing TMB from source\n")
          cat("========================================\n")

          install.packages(
            "TMB",
            repos = "https://cloud.r-project.org",
            type = "source"
          )

          cat("\nTesting TMB...\n")

          library(TMB)

          cat(
            "TMB version:",
            as.character(packageVersion("TMB")),
            "\n"
          )

          cat(
            "TMB path:",
            find.package("TMB"),
            "\n"
          )

          cat("TMB loaded successfully.\n")


          # ----------------------------------------------------
          # gllvm
          # ----------------------------------------------------

          cat("\n========================================\n")
          cat("Installing gllvm from source\n")
          cat("========================================\n")

          install.packages(
            "gllvm",
            repos = "https://cloud.r-project.org",
            type = "source"
          )

          cat("\nTesting gllvm...\n")

          library(gllvm)

          cat(
            "gllvm version:",
            as.character(packageVersion("gllvm")),
            "\n"
          )

          cat(
            "gllvm path:",
            find.package("gllvm"),
            "\n"
          )

          cat("gllvm loaded successfully.\n")


          # ----------------------------------------------------
          # glmmTMB
          # ----------------------------------------------------

          cat("\n========================================\n")
          cat("Installing glmmTMB from source\n")
          cat("========================================\n")

          install.packages(
            "glmmTMB",
            repos = "https://cloud.r-project.org",
            type = "source"
          )

          cat("\nTesting glmmTMB...\n")

          library(glmmTMB)

          cat(
            "glmmTMB version:",
            as.character(packageVersion("glmmTMB")),
            "\n"
          )

          cat(
            "glmmTMB path:",
            find.package("glmmTMB"),
            "\n"
          )

          cat("glmmTMB loaded successfully.\n")

        shell: Rscript {0}


      # ========================================================
      # 8. Install phyloseq / Bioconductor dependencies
      # ========================================================

      - name: Install Bioconductor packages
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            install.packages(
              "BiocManager",
              repos = "https://cloud.r-project.org"
            )
          }

          if (!requireNamespace("phyloseq", quietly = TRUE)) {
            BiocManager::install(
              "phyloseq",
              ask = FALSE,
              update = FALSE
            )
          }

        shell: Rscript {0}


      # ========================================================
      # 9. Show diagnostic information
      # ========================================================

      - name: Show R session information
        run: |
          cat("========================================\n")
          cat("R version\n")
          cat("========================================\n")

          print(R.version.string)

          cat("\n========================================\n")
          cat("Platform\n")
          cat("========================================\n")

          print(R.version$platform)

          cat("\n========================================\n")
          cat("Library paths\n")
          cat("========================================\n")

          print(.libPaths())

          cat("\n========================================\n")
          cat("Session information\n")
          cat("========================================\n")

          print(sessionInfo())

        shell: Rscript {0}


      # ========================================================
      # 10. Explicitly test compiled modeling dependencies
      #
      # This test is deliberately performed before R CMD check.
      # If one of these packages cannot load, the failure is in
      # the compiled dependency/toolchain rather than eDNAModel.
      # ========================================================

      - name: Test TMB, gllvm and glmmTMB
        run: |
          cat("R version:\n")
          print(R.version.string)


          # ----------------------------------------------------
          # TMB
          # ----------------------------------------------------

          cat("\n========================================\n")
          cat("TMB\n")
          cat("========================================\n")

          cat("Version:\n")
          print(packageVersion("TMB"))

          cat("Path:\n")
          print(find.package("TMB"))

          cat("Loading TMB...\n")

          library(TMB)

          cat("TMB loaded successfully.\n")


          # ----------------------------------------------------
          # gllvm
          # ----------------------------------------------------

          cat("\n========================================\n")
          cat("gllvm\n")
          cat("========================================\n")

          cat("Version:\n")
          print(packageVersion("gllvm"))

          cat("Path:\n")
          print(find.package("gllvm"))

          cat("Loading gllvm...\n")

          library(gllvm)

          cat("gllvm loaded successfully.\n")


          # ----------------------------------------------------
          # glmmTMB
          # ----------------------------------------------------

          cat("\n========================================\n")
          cat("glmmTMB\n")
          cat("========================================\n")

          cat("Version:\n")
          print(packageVersion("glmmTMB"))

          cat("Path:\n")
          print(find.package("glmmTMB"))

          cat("Loading glmmTMB...\n")

          library(glmmTMB)

          cat("glmmTMB loaded successfully.\n")

        shell: Rscript {0}


      # ========================================================
      # 11. Run R CMD check
      # ========================================================

      - name: Run R CMD check
        run: |
          rcmdcheck::rcmdcheck(
            args = "--no-manual",
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}


      # ========================================================
      # 12. Show testthat output
      # ========================================================

      - name: Show testthat output
        if: always()
        run: |
          find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash


      # ========================================================
      # 13. Show package installation log
      # ========================================================

      - name: Show installation log
        if: always()
        run: |
          find check -name '00install.out' -exec cat '{}' \; || true
        shell: bash


      # ========================================================
      # 14. Show R CMD check log
      # ========================================================

      - name: Show R CMD check log
        if: always()
        run: |
          find check -name '00check.log' -exec cat '{}' \; || true
        shell: bash


      # ========================================================
      # 15. Upload R CMD check results
      # ========================================================

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R-CMD-check-results-${{ matrix.config.os }}-${{ matrix.config.r }}-${{ github.run_id }}
          path: check
          if-no-files-found: ignore
          compression-level: 6
          overwrite: false
          
